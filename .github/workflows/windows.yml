name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VERSION: ci-${{ github.run_number }}
    steps:
      - name: Allow long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # No disc is involved anywhere: nothing here is made from the game. The runner's Visual Studio brings clang-cl,
      # CMake, Ninja and its LLVM (clang.exe and lld-link.exe go into the package as the bundled compiler).
      - name: Build and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Check([string]$what) { if ($LASTEXITCODE) { throw "$what failed ($LASTEXITCODE)" } }
          . ./tools/devenv.ps1
          Write-Host "Visual Studio: $vs"
          clang-cl --version
          cmake --preset windows-clang
          Check 'configure'
          cmake --build build/windows-clang --target tww
          Check 'build'
          # the randomizer's generator for the package: Python, wwrando and gclib, downloaded and checked against pinned hashes
          python tools/rando/rando_runtime.py
          Check 'rando_runtime'
          ./tools/package.ps1 -Version $env:VERSION -NoZip
          Check 'package'

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: boat-of-daphnes-${{ env.VERSION }}-windows-x64
          path: dist/boat-of-daphnes-${{ env.VERSION }}-windows-x64
          if-no-files-found: error
